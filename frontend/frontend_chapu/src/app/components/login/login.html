<div class="min-h-screen flex items-center justify-center bg-gray-900 relative overflow-hidden">
  <!-- Dynamic Background Accents -->
  <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-cyan-500/20 rounded-full blur-[100px]"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600/20 rounded-full blur-[100px]"></div>

  <div class="relative w-full max-w-md p-8 bg-white/10 backdrop-blur-xl border border-white/20 shadow-2xl rounded-3xl z-10">
    <div class="text-center mb-10">
      <h2 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">
        mzigoChapU
      </h2>
      <p class="mt-2 text-sm text-gray-300 tracking-wide">Connect with Tanzania's freight network</p>
    </div>

    <form class="space-y-6" (submit)="onLoginSubmit(); $event.preventDefault()">
      
      <!-- Phone Number -->
      <div class="relative">
        <label for="phone_number" class="text-xs font-semibold text-cyan-300 uppercase tracking-wider">Phone Number</label>
        <div class="mt-1 relative flex items-center">
          <span class="absolute left-3 text-gray-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
          </span>
          <input id="phone_number" name="phone_number" type="tel" [(ngModel)]="loginData.phone_number" required
            class="w-full bg-white/5 border border-white/10 text-white rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition-all placeholder-gray-500"
            placeholder="0712345678">
        </div>
      </div>

      <!-- Password -->
      <div class="relative">
        <label for="password" class="text-xs font-semibold text-purple-300 uppercase tracking-wider">Password</label>
        <div class="mt-1 relative flex items-center">
          <span class="absolute left-3 text-gray-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
          </span>
          <input id="password" name="password" type="password" [(ngModel)]="loginData.password" required
            class="w-full bg-white/5 border border-white/10 text-white rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent transition-all placeholder-gray-500"
            placeholder="••••••••">
        </div>
      </div>

      <div *ngIf="loginError" class="bg-red-500/20 border border-red-500/50 text-red-200 text-sm text-center p-3 rounded-lg backdrop-blur-md">
        {{ loginError }}
      </div>

      <div class="pt-2">
        <button type="submit"
          class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-white bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-cyan-400 transform transition-all hover:scale-[1.02] shadow-[0_0_15px_rgba(6,182,212,0.5)]">
          Sign In
        </button>
      </div>
    </form>
    
    <p class="mt-8 text-center text-sm text-gray-400">
      Don't have an account? 
      <a routerLink="/register" class="font-semibold text-cyan-400 hover:text-cyan-300 transition-colors">Sign Up</a>
    </p>
  </div>
</div>
