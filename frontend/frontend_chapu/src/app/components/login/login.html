<div style="min-height:100vh; background:var(--color-surface-dark); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;">

  <!-- Logo -->
  <a routerLink="/" style="margin-bottom:40px; display:flex; align-items:center; gap:8px; text-decoration:none;">
    <span style="font-size:24px; font-weight:600; color:var(--color-primary); font-family:var(--font-display);">mzigoChapU</span>
  </a>

  <!-- Card -->
  <div class="cb-card" style="width:100%; max-width:440px;">
    <h1 style="font-family:var(--font-display); font-size:28px; font-weight:400; letter-spacing:-0.5px; color:var(--color-ink); margin:0 0 4px 0;">Sign in</h1>
    <p style="margin:0 0 32px 0; color:var(--color-body); font-size:14px;">Connect with Tanzania's freight network</p>

    <form (submit)="onLoginSubmit(); $event.preventDefault();" style="display:flex; flex-direction:column; gap:20px;">

      <!-- Phone Number -->
      <div>
        <label for="phone_number" class="cb-input-label">Phone number</label>
        <input
          id="phone_number"
          name="phone_number"
          type="tel"
          [(ngModel)]="loginData.phone_number"
          class="cb-input"
          placeholder="0712 345 678"
          required>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="cb-input-label">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="loginData.password"
          class="cb-input"
          placeholder="••••••••"
          required>
      </div>

      <!-- Error -->
      <div *ngIf="loginError" class="cb-alert-error">{{ loginError }}</div>

      <!-- Submit -->
      <button type="submit" class="cb-btn-primary" style="width:100%; margin-top:4px;">
        Sign in
      </button>
    </form>

    <hr class="cb-divider" style="margin:28px 0;">

    <p style="text-align:center; font-size:14px; color:var(--color-body); margin:0;">
      Don't have an account?
      <a routerLink="/register" style="color:var(--color-primary); font-weight:600; text-decoration:none; margin-left:4px;">Create account</a>
    </p>
  </div>

</div>
