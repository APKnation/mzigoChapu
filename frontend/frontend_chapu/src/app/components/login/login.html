<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Sign in to your mzigoChapU account</h2>
      <p class="mt-2 text-center text-sm text-gray-600">Connect with Tanzania's freight network</p>
    </div>
    <form class="mt-8 space-y-6" (submit)="onLoginSubmit(); $event.preventDefault()">
      <div class="rounded-md shadow-sm -space-y-px">
        <div class="mb-4">
          <label for="phone_number" class="sr-only">Phone Number</label>
          <input id="phone_number" name="phone_number" type="tel" [(ngModel)]="loginData.phone_number" required
            class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
            placeholder="Phone Number (Nambari ya Simu: 0712345678)">
        </div>
        <div class="mb-4">
          <label for="password" class="sr-only">Password</label>
          <input id="password" name="password" type="password" [(ngModel)]="loginData.password" required
            class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
            placeholder="Password (Nywila)">
        </div>
      </div>

      <div *ngIf="loginError" class="text-red-500 text-sm text-center">{{ loginError }}</div>

      <div>
        <button type="submit"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
          Sign in (Ingia)
        </button>
      </div>
    </form>
    <p class="mt-6 text-center text-sm text-gray-600">
      Don't have an account? <a routerLink="/register" class="font-medium text-blue-600 hover:text-blue-500">Register here (Jisajili hapa)</a>
    </p>
  </div>
</div>
