<div class="min-h-screen flex items-center justify-center bg-gray-900 relative overflow-hidden py-12 px-4">
  <!-- Dynamic Background Accents -->
  <div class="absolute top-[10%] right-[-10%] w-[30rem] h-[30rem] bg-purple-600/20 rounded-full blur-[120px]"></div>
  <div class="absolute bottom-[-10%] left-[-10%] w-[30rem] h-[30rem] bg-cyan-500/20 rounded-full blur-[120px]"></div>

  <div class="relative w-full max-w-md p-8 bg-white/10 backdrop-blur-xl border border-white/20 shadow-2xl rounded-3xl z-10">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">
        Register Account
      </h2>
      <p class="mt-2 text-sm text-gray-300 tracking-wide">Join Tanzania's modern freight platform</p>
    </div>

    <form class="space-y-5" (submit)="onRegisterSubmit(); $event.preventDefault()">
      
      <!-- Full Name -->
      <div class="relative">
        <label for="username" class="text-xs font-semibold text-cyan-300 uppercase tracking-wider">Full Name</label>
        <div class="mt-1 relative flex items-center">
          <span class="absolute left-3 text-gray-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          </span>
          <input id="username" name="username" type="text" [(ngModel)]="registerData.username" required
            class="w-full bg-white/5 border border-white/10 text-white rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition-all placeholder-gray-500"
            placeholder="Jane Doe">
        </div>
      </div>

      <!-- Phone Number -->
      <div class="relative">
        <label for="phone_number" class="text-xs font-semibold text-purple-300 uppercase tracking-wider">Phone Number</label>
        <div class="mt-1 relative flex items-center">
          <span class="absolute left-3 text-gray-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
          </span>
          <input id="phone_number" name="phone_number" type="tel" [(ngModel)]="registerData.phone_number" required
            class="w-full bg-white/5 border border-white/10 text-white rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent transition-all placeholder-gray-500"
            placeholder="+255 712 345 678">
        </div>
      </div>

      <!-- Password -->
      <div class="grid grid-cols-2 gap-4">
        <div class="relative">
          <label for="password" class="text-xs font-semibold text-cyan-300 uppercase tracking-wider">Password</label>
          <div class="mt-1 relative flex items-center">
            <input id="password" name="password" type="password" [(ngModel)]="registerData.password" required
              class="w-full bg-white/5 border border-white/10 text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition-all placeholder-gray-500"
              placeholder="••••••••">
          </div>
        </div>
        <div class="relative">
          <label for="confirmPassword" class="text-xs font-semibold text-cyan-300 uppercase tracking-wider">Confirm</label>
          <div class="mt-1 relative flex items-center">
            <input id="confirmPassword" name="confirmPassword" type="password" [(ngModel)]="registerData.confirmPassword" required
              class="w-full bg-white/5 border border-white/10 text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition-all placeholder-gray-500"
              placeholder="••••••••">
          </div>
        </div>
      </div>

      <!-- Account Type -->
      <div class="relative">
        <label for="user_role" class="text-xs font-semibold text-purple-300 uppercase tracking-wider">Account Type</label>
        <div class="mt-1 relative">
          <select id="user_role" name="user_role" [(ngModel)]="registerData.user_role"
            class="appearance-none w-full bg-white/5 border border-white/10 text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent transition-all cursor-pointer">
            <option value="cargo_owner" class="bg-gray-800 text-white">Cargo Owner / Farmer</option>
            <option value="truck_owner" class="bg-gray-800 text-white">Truck Owner / Driver</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>
      </div>

      <div *ngIf="registerError" class="bg-red-500/20 border border-red-500/50 text-red-200 text-sm text-center p-3 rounded-lg backdrop-blur-md">
        {{ registerError }}
      </div>
      <div *ngIf="registerSuccess" class="bg-green-500/20 border border-green-500/50 text-green-200 text-sm text-center p-3 rounded-lg backdrop-blur-md">
        {{ registerSuccess }}
      </div>

      <div class="pt-4">
        <button type="submit"
          class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-white bg-gradient-to-r from-purple-600 to-cyan-500 hover:from-purple-500 hover:to-cyan-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-purple-400 transform transition-all hover:scale-[1.02] shadow-[0_0_15px_rgba(168,85,247,0.5)]">
          Create Account
        </button>
      </div>
    </form>
    
    <p class="mt-8 text-center text-sm text-gray-400">
      Already have an account? 
      <a routerLink="/login" class="font-semibold text-purple-400 hover:text-purple-300 transition-colors">Sign In</a>
    </p>
  </div>
</div>
