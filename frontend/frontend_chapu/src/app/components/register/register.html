<div style="min-height:100vh; background:var(--color-surface-dark); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px;">

  <!-- Logo -->
  <a routerLink="/" style="margin-bottom:40px; display:flex; align-items:center; gap:8px; text-decoration:none;">
    <span style="font-size:24px; font-weight:600; color:var(--color-primary); font-family:var(--font-display);">mzigoChapU</span>
  </a>

  <!-- Card -->
  <div class="cb-card" style="width:100%; max-width:480px;">
    <h1 style="font-family:var(--font-display); font-size:28px; font-weight:400; letter-spacing:-0.5px; color:var(--color-ink); margin:0 0 4px 0;">Create your account</h1>
    <p style="margin:0 0 32px 0; color:var(--color-body); font-size:14px;">Join Tanzania's leading freight matching platform</p>

    <form (submit)="onRegisterSubmit(); $event.preventDefault();" style="display:flex; flex-direction:column; gap:20px;">

      <!-- Full Name -->
      <div>
        <label for="username" class="cb-input-label">Full name</label>
        <input
          id="username"
          name="username"
          type="text"
          [(ngModel)]="registerData.username"
          class="cb-input"
          placeholder="Jane Doe"
          required>
      </div>

      <!-- Phone Number -->
      <div>
        <label for="phone_number" class="cb-input-label">Phone number</label>
        <input
          id="phone_number"
          name="phone_number"
          type="tel"
          [(ngModel)]="registerData.phone_number"
          class="cb-input"
          placeholder="0712 345 678"
          required>
        <p style="font-size:12px; color:var(--color-muted); margin:6px 0 0 0;">Format: 0712345678 or +255712345678</p>
      </div>

      <!-- Password row -->
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div>
          <label for="password" class="cb-input-label">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="registerData.password"
            class="cb-input"
            placeholder="••••••••"
            required>
        </div>
        <div>
          <label for="confirmPassword" class="cb-input-label">Confirm</label>
          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            [(ngModel)]="registerData.confirmPassword"
            class="cb-input"
            placeholder="••••••••"
            required>
        </div>
      </div>

      <!-- Account Type -->
      <div style="position:relative;">
        <label for="user_role" class="cb-input-label">Account type</label>
        <select id="user_role" name="user_role" [(ngModel)]="registerData.user_role" class="cb-select">
          <option value="cargo_owner">Cargo Owner / Farmer</option>
          <option value="truck_owner">Truck Owner / Driver</option>
        </select>
        <span style="position:absolute; right:16px; bottom:14px; color:var(--color-muted); pointer-events:none; font-size:12px;">▼</span>
      </div>

      <!-- Alerts -->
      <div *ngIf="registerError" class="cb-alert-error">{{ registerError }}</div>
      <div *ngIf="registerSuccess" class="cb-alert-success">{{ registerSuccess }}</div>

      <!-- Submit -->
      <button type="submit" class="cb-btn-primary" style="width:100%; margin-top:4px;">
        Create account
      </button>
    </form>

    <hr class="cb-divider" style="margin:28px 0;">

    <p style="text-align:center; font-size:14px; color:var(--color-body); margin:0;">
      Already have an account?
      <a routerLink="/login" style="color:var(--color-primary); font-weight:600; text-decoration:none; margin-left:4px;">Sign in</a>
    </p>
  </div>

</div>
