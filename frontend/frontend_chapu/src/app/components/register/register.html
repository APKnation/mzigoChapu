
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Create your mzigoChapU account</h2>
      <p class="mt-2 text-center text-sm text-gray-600">Join Tanzania's leading freight matching platform</p>
    </div>
    <form class="mt-8 space-y-6" (submit)="onRegisterSubmit(); $event.preventDefault()">
      <div class="rounded-md shadow-sm -space-y-px">
        <div class="mb-4">
          <label for="username" class="sr-only">Full Name</label>
          <input id="username" name="username" type="text" [(ngModel)]="registerData.username" required
            class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
            placeholder="Full Name (Jina Kamili)">
        </div>
        <div class="mb-4">
          <label for="phone_number" class="sr-only">Phone Number</label>
          <input id="phone_number" name="phone_number" type="tel" [(ngModel)]="registerData.phone_number" required
            class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
            placeholder="Phone Number (Nambari ya Simu: 0712345678)">
        </div>
        <div class="mb-4">
          <label for="password" class="sr-only">Password</label>
          <input id="password" name="password" type="password" [(ngModel)]="registerData.password" required
            class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
            placeholder="Password (Nywila)">
        </div>
        <div class="mb-4">
          <label for="confirmPassword" class="sr-only">Confirm Password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" [(ngModel)]="registerData.confirmPassword" required
            class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
            placeholder="Confirm Password (Thibitisha Nywila)">
        </div>
        <div class="mb-4">
          <label for="user_role" class="block text-sm font-medium text-gray-700 mb-1">Account Type (Aina ya Akaunti)</label>
          <select id="user_role" name="user_role" [(ngModel)]="registerData.user_role"
            class="block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            <option value="cargo_owner">Cargo Owner / Farmer (Nina mizigo ya kusafirisha)</option>
            <option value="truck_owner">Truck Owner / Driver (Nina gari la kusafirisha)</option>
          </select>
        </div>
      </div>

      <div *ngIf="registerError" class="text-red-500 text-sm text-center">{{ registerError }}</div>
      <div *ngIf="registerSuccess" class="text-green-500 text-sm text-center">{{ registerSuccess }}</div>

      <div>
        <button type="submit"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
          Create Account (Jisajili)
        </button>
      </div>
    </form>
    <p class="mt-6 text-center text-sm text-gray-600">
      Already have an account? <a routerLink="/login" class="font-medium text-blue-600 hover:text-blue-500">Sign in here (Ingia hapa)</a>
    </p>
  </div>
</div>
